function buildNodes(){
  for(var key in LINES){
    var L = LINES[key], N = L.s.length;
    for(var i=0;i<N;i++){
      var texts = L.s[i][0], ops = L.s[i][1];
      for(var k=0;k<texts.length;k++){
        var id = key+"_"+i+"_"+k;
        NODES[id] = { line:key, stage:i, text:texts[k], opts: ops.map(function(o,j){
          return { t:o[0], d:[o[1],o[2],o[3],o[4],o[5]],
            next: (i===N-1) ? (key+"_end"+j) : (key+"_"+(i+1)+"_"+j) };
        })};
      }
    }
    for(var e=0;e<ENDS[key].length;e++){
      NODES[key+"_end"+e] = { line:key, end:true, text:ENDS[key][e] };
    }
  }
}
buildNodes();
NODES.start = { line:null, stage:0, text:START.text, opts:START.opts };

var score=[0,0,0,0,0];
var cur="start";
var hist=[];
var picks=[];

function deltaText(d){
  var parts=[];
  for(var i=0;i<5;i++){
    if(d[i]!==0){
      parts.push(CN[i]+(d[i]>0?" +":" −")+Math.abs(d[i]));
    }
  }
  return parts.length?parts.join("　"):"· 无变化";
}
function maxOf(a){var m=1;for(var i=0;i<a.length;i++){m=Math.max(m,Math.abs(a[i]));}return m;}
function refreshHud(){
  var m=maxOf(score);
  for(var i=0;i<5;i++){
    document.getElementById("v"+i).textContent = score[i];
    var w = Math.max(0, Math.min(100, Math.round(Math.abs(score[i])/m*100)));
    document.getElementById("b"+i).style.width = w+"%";
  }
  document.getElementById("mCount").textContent = "已选择 "+picks.length+" 次";
  var left = 16 - picks.length;
  document.getElementById("mLeft").textContent = left>0 ? ("距终点至少还需 "+left+" 次") : "已进入收束段";
  var bk=document.getElementById("back");
  bk.disabled = hist.length===0;
  bk.style.opacity = hist.length===0 ? ".4" : "1";
  bk.style.cursor = hist.length===0 ? "not-allowed" : "pointer";
}
function render(){
  var node = NODES[cur];
  var story=document.getElementById("story");
  var box=document.getElementById("opts");
  var tag=document.getElementById("tag");
  box.innerHTML="";

  if(node.end){
    tag.textContent = LINES[node.line].n + " · 终章";
    story.innerHTML = '<div class="end"><div>'+node.text.replace(/\n/g,"</div><div>")+'</div>'+
      '<div class="score">'+ [0,1,2,3,4].map(function(i){
        return '<div class="row"><span>'+CN[i]+'</span><b>'+score[i]+'</b></div>';
      }).join("") +'</div>'+
      '<div class="verdict" id="verdict"></div></div>';
    var idx=0,mx=score[0];
    for(var i=1;i<5;i++){if(score[i]>mx){mx=score[i];idx=i;}}
    document.getElementById("verdict").innerHTML = "十六次选择之后，你身上最突出的是 <em>"+CN[idx]+"</em>。"+
      (picks.length>=15 ? "你完整地走完了一条长线，每层五个选项都被你亲手筛过一遍。" : "");
    refreshHud();
    updateTrail();
    return;
  }

  if(node.line){
    tag.textContent = LINES[node.line].n + " · 第 "+(node.stage+1)+" / "+LINES[node.line].s.length+" 层"+(node.stage===0?" · 起点":"");
  } else {
    tag.textContent = "序章 · 站在大三的分岔口";
  }
  story.textContent = node.text;
  node.opts.forEach(function(o,j){
    var b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML='<span class="idx">'+(j+1)+'</span><span class="body"><span class="tx"></span><span class="dl">'+deltaText(o.d)+'</span></span>';
    b.querySelector(".tx").textContent=o.t;
    b.addEventListener("click",function(){
      hist.push({cur:cur,score:score.slice(),picks:picks.slice()});
      for(var i=0;i<5;i++){score[i]+=o.d[i];}
      picks.push(o.t);
      cur=o.next;
      render();
    });
    box.appendChild(b);
  });
  refreshHud();
  updateTrail();
}
function updateTrail(){
  var t=document.getElementById("trail");
  if(!picks.length){t.textContent="";return;}
  t.textContent="选择轨迹："+picks.map(function(p,i){return (i+1)+"."+p;}).join("　");
}
document.getElementById("back").addEventListener("click",function(){
  if(!hist.length){return;}
  var s=hist.pop();
  cur=s.cur; score=s.score; picks=s.picks;
  render();
});
document.getElementById("restart").addEventListener("click",function(){
  cur="start"; score=[0,0,0,0,0]; hist=[]; picks=[];
  render();
});
render();
</script>
