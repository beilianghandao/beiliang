let currentId = "start";

// 渲染函数
function render(){
  const node = nodeData[currentId];
  document.getElementById("sMind").innerText = score.mind;
  document.getElementById("sPractice").innerText = score.practice;
  document.getElementById("sEmotion").innerText = score.emotion;
  document.getElementById("sStudy").innerText = score.study;
  document.getElementById("sSocial").innerText = score.social;

  const box = document.getElementById("storyBox");
  const optBox = document.getElementById("optionBox");
  optBox.innerHTML = "";

  if(node.isEnd){
    let t = node.text
      .replace("${mind}",score.mind)
      .replace("${practice}",score.practice)
      .replace("${emotion}",score.emotion)
      .replace("${study}",score.study)
      .replace("${social}",score.social);
    box.innerHTML = `<div class="ending">${t}</div>`;
    return;
  }
  box.innerText = node.text;
  node.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = opt.text + `<div class="option-desc">${opt.desc}</div>`;
    btn.onclick = ()=>{
      // 保存历史
      history.push({id:currentId,score:JSON.parse(JSON.stringify(score))});
      // 加分
      score.mind += opt.delta.mind;
      score.practice += opt.delta.practice;
      score.emotion += opt.delta.emotion;
      score.study += opt.delta.study;
      score.social += opt.delta.social;
      currentId = opt.next;
      render();
    };
    optBox.appendChild(btn);
  })
}

// 回退
document.getElementById("btnBack").onclick = function(){
  if(history.length===0) return alert("已经是起点，无法回退");
  const last = history.pop();
  currentId = last.id;
  score = last.score;
  render();
}

// 重启
document.getElementById("btnRestart").onclick = function(){
  score = {mind:0,practice:0,emotion:0,study:0,social:0};
  history = [];
  currentId = "start";
  render();
}

render();
</script>
